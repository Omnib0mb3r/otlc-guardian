name: OTLC Guardian — Security Audit

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Guardian unit tests
        if: hashFiles('tests/injection-guard.test.js') != ''
        run: node tests/injection-guard.test.js

      - name: Run guardian check
        if: hashFiles('bin/guardian.js') != ''
        run: node bin/guardian.js check

      - name: Run OTLC Guardian Safety Audit
        run: node security/03-audit.js . --fail-on-error
        continue-on-error: false

      - name: Check for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerability scan (Node)
        if: hashFiles('package.json') != ''
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Dependency vulnerability scan (Python)
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true
