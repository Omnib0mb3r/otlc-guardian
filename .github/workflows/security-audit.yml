name: OTLC Guardian — Security Audit

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Bumped to v6 (Nov 2025, latest stable as of 2026-04-08) to
        # resolve the Node 20 deprecation warning. GitHub announced
        # that v4 will be force-migrated to Node 24 on 2026-06-02 and
        # Node 20 removed from runners entirely on 2026-09-16. v6 runs
        # on Node 24 natively so the warning goes away and the action
        # keeps working after the runner migration.
        uses: actions/checkout@v6
        with:
          # Full history is required for gitleaks to compute the diff
          # range on pull_request events. Without this, the action
          # tries to scan HEAD^..HEAD but the parent commit isn't in
          # the shallow clone and the step fails with "unknown
          # revision". Only matters on PR events; push events provide
          # the before/after SHAs through the event payload directly.
          fetch-depth: 0

      - name: Setup Node.js
        # Bumped to v6 (Dec 2025, latest stable as of 2026-04-08) — same
        # Node 24 forward path as actions/checkout@v6. The `node-version`
        # input below (the runtime Guardian's tests run against) is a
        # separate concern from the Node version the ACTION ITSELF runs
        # on; the action version determines the latter.
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run Guardian unit tests
        # All six test files run via the project's `npm test` script so the
        # CI invocation matches what a developer runs locally. The earlier
        # if-this-file-exists guards are gone — these test files are part
        # of the package and any missing one is a real bug, not a soft skip.
        if: hashFiles('tests/injection-guard.test.js') != ''
        run: npm test

      - name: Run guardian check
        if: hashFiles('bin/guardian.js') != ''
        run: node bin/guardian.js check

      - name: Run OTLC Guardian Safety Audit
        run: node security/03-audit.js . --fail-on-error
        continue-on-error: false

      - name: Audit exemption visibility
        # Print the count of exempted files to the workflow summary so
        # any unexplained growth in the exemption list is visible at a
        # glance in the Actions tab. The audit's own output above also
        # lists every exempted file by name on every run.
        run: |
          node security/03-audit.js . --json > /tmp/audit.json
          EXEMPT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/audit.json','utf8')).exempt.total)")
          echo "## OTLC Guardian audit summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Files exempted from scanning: **$EXEMPT**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If this number is unexpected, review security/.audit-allowlist and any files containing the per-file exempt marker." >> $GITHUB_STEP_SUMMARY

      - name: Check for secrets with Gitleaks
        # Pinned to v2.3.9 (the latest v2.x tag as of 2026-04-08, released
        # Apr 2025) rather than the floating @v2. The floating tag would
        # also work today but pinning to an exact version gives us a
        # reproducible build and catches silent upstream regressions.
        # When v3 ships (or v2 gains a further Node bump), re-verify
        # against github.com/gitleaks/gitleaks-action/releases and bump.
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency vulnerability scan (Node)
        if: hashFiles('package.json') != ''
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Dependency vulnerability scan (Python)
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
        continue-on-error: true
