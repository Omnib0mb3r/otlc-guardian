# .github/secret_scanning.yml
# Configures GitHub Advanced Secret Scanning push protection.
# Docs: https://docs.github.com/en/code-security/secret-scanning

# Omit paths from secret scanning (e.g. test fixtures with fake keys)
paths-ignore:
  - "**/*.test.js"
  - "**/*.spec.js"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/test/**"
  - "**/fixtures/**"
  - "**/__mocks__/**"
  - "docs/examples/**"
